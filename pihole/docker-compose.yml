services:
  pihole:
    image: pihole/pihole:latest
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "90:80/tcp"
    environment:
      TZ: Europe/Paris
      FTLCONF_webserver_api_password: ${FTLCONF_webserver_api_password}
      FTLCONF_dns_upstreams: unbound#53
      FTLCONF_dns_listeningMode: all
    cap_add:
      - NET_ADMIN
      - CAP_SYS_TIME
      - CAP_SYS_NICE
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
    restart: unless-stopped
    depends_on:
      unbound:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`pihole.${DOMAIN}`)"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.routers.pihole.tls.certresolver=le"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"
      - "traefik.http.middlewares.pihole-redirect.redirectregex.regex=^(https?://[^/]+)/?$$"
      - "traefik.http.middlewares.pihole-redirect.redirectregex.replacement=$${1}/admin/"
      - "traefik.http.routers.pihole.middlewares=pihole-redirect"
    networks:
      - traefik
      - default

  unbound:
    image: mvance/unbound:latest
    ports:
      - "5335:53"
    volumes:
      # Custom tuned config. Because it exists, the image's auto-generated
      # config is skipped (the image only auto-includes a-records.conf /
      # srv-records.conf / forward-records.conf; *.conf wildcard is off).
      - './unbound-config/unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro'
      - './unbound-config/a-records.conf:/opt/unbound/etc/unbound/a-records.conf:ro'
    restart: unless-stopped
    healthcheck:
      # drill uses the root-server hints in unbound itself, so it stays green
      # even if upstream internet is temporarily unavailable.
      test: ["CMD", "drill", "@127.0.0.1", "cloudflare.com"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

networks:
  traefik:
    external: true
