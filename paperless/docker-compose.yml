services:
  broker:
    image: docker.io/library/redis:7
    restart: unless-stopped
    volumes:
      - ./redisdata:/data

  db:
    image: docker.io/library/postgres:16
    restart: unless-stopped
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: dbpass

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    restart: unless-stopped
    depends_on:
      - db
      - broker
    # ports:
    #   - "9000:8000"
    volumes:
      - ./data:/usr/src/paperless/data
      - ${PAPERLESS_MEDIA_DIR}:/usr/src/paperless/media
      - ./export:/usr/src/paperless/export
      - ./consume:/usr/src/paperless/consume
    environment:
      PAPERLESS_URL: https://paperless.${DOMAIN}
      PAPERLESS_CSRF_TRUSTED_ORIGINS: https://paperless.${DOMAIN}

      # Database and Redis settings
      PAPERLESS_REDIS: redis://broker:6379
      PAPERLESS_DBHOST: db
      PAPERLESS_DBPASS: dbpass
      
      # Security and Localization
      PAPERLESS_SECRET_KEY: d0bc3c84-e589-43a4-bb7e-61b7c2a11589
      PAPERLESS_TIME_ZONE: Europe/Paris
      PAPERLESS_OCR_LANGUAGE: eng

      PAPERLESS_FILENAME_FORMAT: '{created_year}/{document_type}/{correspondent}/{title}'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless.rule=Host(`paperless.${DOMAIN}`)"
      - "traefik.http.routers.paperless.entrypoints=websecure"
      - "traefik.http.routers.paperless.tls.certresolver=le"
      - "traefik.http.services.paperless.loadbalancer.server.port=8000"
      - "traefik.docker.network=traefik"
    networks:
      - traefik
      - default

  paperless-ai:
    image: clusterzx/paperless-ai:latest
    # image: paperless-ai-dev:d497005
    restart: unless-stopped
    ports:
      - 3000:3000
    depends_on:
      - webserver
    volumes:
      - ./paperless-ai-data:/app/data
    # environment:
      # PAPERLESS_AI_INITIAL_SETUP: "1"
      # PAPERLESS_API_URL: http://webserver:8000
      # PAPERLESS_API_URL: http://paperless.${DOMAIN}:8000
      # PAPERLESS_API_TOKEN: ${PAPERLESS_API_TOKEN}
      # AI_PROVIDER: custom
      # CUSTOM_BASE_URL: http://192.168.1.127:8080/v1
      # CUSTOM_API_KEY: not-needed
      # CUSTOM_MODEL: mlx-community/Qwen2.5-7B-Instruct-4bit
      # SCAN_INTERVAL: "*/30 * * * *"
      # ADD_AI_PROCESSED_TAG: "true"
      # AI_PROCESSED_TAG_NAME: ai-processed
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.paperless-ai.rule=Host(`paperless-ai.${DOMAIN}`)"
      - "traefik.http.routers.paperless-ai.entrypoints=websecure"
      - "traefik.http.routers.paperless-ai.tls.certresolver=le"
      - "traefik.http.services.paperless-ai.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik"
    networks:
      - traefik
      - default

networks:
  traefik:
    external: true
